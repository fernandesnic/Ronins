<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronins</title>
    <link rel="shortcut icon" href="assets/icone.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"rel="stylesheet">
    <script src="https://kit.fontawesome.com/6105ef985f.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Ceviche+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Trade+Winds&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo-absolute">
            <a href="#home"><img src="assets/RoninsLogo/RONINS Quad Rugby.png" alt="Logo" title="Início"/></a>
            <a href="#home"><img src="assets/RoninsLogo/RONINS Quad Rugbyb.png" alt="Logo" title="Início"/></a>
        </div>
        <div class="hamburguer" id="hamburguer">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="header-grid">
            <nav class="menu">
                <ul>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#equipe">Equipe</a></li>
                    <li><a href="#produtos">Loja</a></li>
                    <li><a href="#galeriatrofeus">Trofeus</a></li>
                    <li><a href="#apoiase">Apoie!</a></li>
                    <li>
                        <button id="theme-switch" class="btn" title="Alterar para modo claro/escuro" aria-label="Alternar entre modo claro e escuro">
                            <span class="fa-solid fa-moon" aria-hidden="true"></span>
                            <span class="fa-solid fa-sun" aria-hidden="true"></span>
                        </button>
                    </li>
                </ul>
                <div id="header-btns">
                    <a id="btn-login" href="#login" class="btn">Login</a>
                </div>
            </nav>
        </div>
    </header>

    <section id="acessibilidade">
        <aside id="configurações">
            <button id="incrFont" class="btn" title="Aumentar fonte"><strong>A+</strong></button>
            <button id="decrFont" class="btn" title="Diminuir fonte"><strong>A-</strong></button>
            <button id="highContrast" class="btn" title="Ativar modo de alto contraste">
                <span class="material-icons-outlined" style="font-size: 1rem;">contrast</span>
            </button>
        </aside> 
        <span id="mainBtn" class="material-icons-outlined">accessibility_new</span>
    </section>

    <main id="app">
        
        
        
    </main>
        
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <a href="#home">
                        <img src="assets/RoninsLogo/RONINS Quad Rugby.png" alt="Logo Ronins">
                        <img src="assets/RoninsLogo/RONINS Quad Rugbyb.png" alt="Logo Ronins">
                    </a>
                    <div class="footer-social">
                        <a href="https://www.instagram.com/roninsrugby?igsh=MW42cWxsdnA5MGY5MQ==" target="_blank" aria-label="Instagram">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="https://www.facebook.com/roninsrugby/?locale=pt_BR" target="_blank" aria-label="Facebook">
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                    </div>
                </div>
                
                <div class="footer-links">
                    <h4>Navegação</h4>
                    <ul>
                        <li><a href="#sobre">Sobre</a></li>
                        <li><a href="#equipe">Equipe</a></li>
                        <li><a href="#produtos">Loja</a></li>
                        <li><a href="#galeriatrofeus">Trofeus</a></li>
                        <li><a href="#apoiase">Apoie!</a></li>
                        <li><a href="#contato">Contato</a></li>
                    </ul>
                </div>
                
                <div class="footer-contact">
                    <h4>Contato</h4>
                    <div class="contact-item">
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:roninsquadrugby@gmail.com">roninsquadrugby@gmail.com</a>
                    </div>
                    <div class="contact-item">
                        <i class="fa-solid fa-phone"></i>
                        <p>(11) 92903-6219</p>
                    </div>
                </div>
            </div>
            
            <div class="copyright">
                <p>&copy; 2025 Ronins Quad Rugby. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script> new window.VLibras.Widget('https://vlibras.gov.br/app'); </script>
    <script src="js/headerDinamico.js" defer></script>
    <script src="js/acessibilidade.js" defer></script> 
    <script src="js/renderPage.js" type="module" defer></script>
    <script src="js/darkmode.js" defer></script>
    <script src="js/auth.js" type="module" defer></script>
    <script src="js/url.js" type="module" defer></script>
    <script type="module">
      import { updateHeaderActions } from './js/auth.js';
      window.addEventListener('DOMContentLoaded', updateHeaderActions);
      window.addEventListener('hashchange', updateHeaderActions);
    </script>
</body>

</html>
